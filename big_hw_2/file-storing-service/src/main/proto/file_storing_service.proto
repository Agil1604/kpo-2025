syntax = "proto3";
package file_storage;

option java_multiple_files = true;
option java_package = "kpo.grpc.file_storage";
option java_outer_classname = "FileStorageProto";

service FileStorageService {
  rpc UploadFile(UploadFileRequest) returns (UploadFileResponse);
  rpc GetFile(GetFileRequest) returns (GetFileResponse);
  rpc CheckFileExists(CheckFileExistsRequest) returns (CheckFileExistsResponse);
}

message UploadFileRequest {
  string filename = 1;
  string content = 2;
}

message UploadFileResponse {
  int32 file_id = 1;
}

message GetFileRequest {
  int32 file_id = 1;
}

message GetFileResponse {
  string filename = 1;
  string content = 2;
}

message CheckFileExistsRequest {
  int32 file_id = 1;
}

message CheckFileExistsResponse {
  bool exists = 1;
}